services:
  # model tracking + model registry (our model bank)
  mlflow:
    image: ghcr.io/mlflow/mlflow:v2.17.2
    command: >
      mlflow server --host 0.0.0.0 --port 5000
      --backend-store-uri sqlite:////mlflow/mlflow.db
      --artifacts-destination /mlflow/artifacts
    volumes:
      - ./mlflow:/mlflow
    ports:
      - "5001:5000"   # 5000 is used by AirPlay on macOS

  airflow-init:
    build: .
    environment:
      - AIRFLOW__CORE__EXECUTOR=SequentialExecutor
      - AIRFLOW__CORE__FERNET_KEY=PAqBeGJLJTYFzVkOGHWIYXdLO7XdXz5yTdxAGJe9ezM=
      - AIRFLOW__CORE__LOAD_EXAMPLES=False
      - MLFLOW_TRACKING_URI=http://mlflow:5000
      - MLFLOW_ENABLE_ARTIFACTS_PROGRESS_BAR=false
    volumes:
      - airflow_data:/opt/airflow
      - ./dags:/opt/airflow/dags
      - .:/opt/airflow/aml
    entrypoint: >
      /bin/bash -c "airflow db init &&
      airflow users create --username admin --password admin --firstname Admin --lastname User --role Admin --email admin@example.com || true"

  airflow-webserver:
    build: .
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    environment:
      - AIRFLOW__CORE__EXECUTOR=SequentialExecutor
      - AIRFLOW__CORE__FERNET_KEY=PAqBeGJLJTYFzVkOGHWIYXdLO7XdXz5yTdxAGJe9ezM=
      - AIRFLOW__CORE__LOAD_EXAMPLES=False
      - MLFLOW_TRACKING_URI=http://mlflow:5000
      - MLFLOW_ENABLE_ARTIFACTS_PROGRESS_BAR=false
    volumes:
      - airflow_data:/opt/airflow
      - ./dags:/opt/airflow/dags
      - .:/opt/airflow/aml
    ports:
      - "8081:8080"   # 8080 is often taken by the lab 5 airflow
    command: webserver

  airflow-scheduler:
    build: .
    depends_on:
      airflow-init:
        condition: service_completed_successfully
      mlflow:
        condition: service_started
    environment:
      - AIRFLOW__CORE__EXECUTOR=SequentialExecutor
      - AIRFLOW__CORE__FERNET_KEY=PAqBeGJLJTYFzVkOGHWIYXdLO7XdXz5yTdxAGJe9ezM=
      - AIRFLOW__CORE__LOAD_EXAMPLES=False
      - MLFLOW_TRACKING_URI=http://mlflow:5000
      - MLFLOW_ENABLE_ARTIFACTS_PROGRESS_BAR=false
    volumes:
      - airflow_data:/opt/airflow
      - ./dags:/opt/airflow/dags
      - .:/opt/airflow/aml
    command: scheduler

  # real-time inference, reads the same feature store and champion model as the batch job
  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    depends_on:
      - mlflow
    environment:
      - MLFLOW_TRACKING_URI=http://mlflow:5000
      - MLFLOW_ENABLE_ARTIFACTS_PROGRESS_BAR=false
      - DATAMART_DIR=/app/datamart/
    volumes:
      - ./datamart:/app/datamart:ro
    ports:
      - "8000:8000"

volumes:
  airflow_data:
