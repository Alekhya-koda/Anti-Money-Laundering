name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.9"

      - name: Install dependencies
        run: pip install -r requirements-api.txt pytest httpx

      - name: Check that all scripts and the DAG compile
        run: python -m py_compile dags/*.py scripts/*.py scripts/utils/*.py api/*.py

      - name: Unit tests
        run: pytest -q tests
